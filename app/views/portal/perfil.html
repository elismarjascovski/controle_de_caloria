{% extends 'portal/layout.html' %}

{% block portal %}

<fieldset style="text-align: center;">
    <legend style="font-size: 15px;">Faça login com o Telegram para vincular ele com sua conta e <br> tenha acesso bot <a target="_blank" href="https://web.telegram.org/k/#@controle_calorias_bot">Controle de Calorias</a> ou adicione manualmente no campo <strong>ID Telegram</strong>.</legend>
    <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="controle_calorias_bot" data-size="large" data-auth-url="http://localhost/authtelegram.php" data-request-access="write"></script>
</fieldset>
<br>
<form id="atualizarDadosForm" class="row g-3" method="POST" action="/perfil/update/{{ dados.user.id }}">
    <div class="col-md-6">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ dados.user.nome }}">
        <div id="nomeFeedback" class="invalid-feedback">
            <span id="nomeFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="nascimento" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="nascimento" name="nascimento" value="{{ dados.user.nascimento }}">
        <div id="nascimentoFeedback" class="invalid-feedback">
            <span id="nascimentoFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="peso" class="form-label">Peso (kg)</label>
        <input type="number" class="form-control" id="peso" name="peso" value="{{ dados.user.peso }}">
        <div id="pesoFeedback" class="invalid-feedback">
            <span id="pesoFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" class="form-control" id="altura" name="altura" value="{{ dados.user.altura }}">
        <div id="alturaFeedback" class="invalid-feedback">
            <span id="alturaFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ dados.user.email }}">
        <div id="emailFeedback" class="invalid-feedback">
            <span id="emailFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="ds_genero" class="form-label">Gênero</label>
        <select name="ds_genero" class="form-select" id="ds_genero">
            <option value="">Selecione o seu gênero</option>
            <option value="MA" {% if dados.user.ds_genero == 'MA' %}selected{% endif %}>Masculino</option>
            <option value="FE" {% if dados.user.ds_genero == 'FE' %}selected{% endif %}>Feminino</option>
        </select>
        <div id="ds_generoFeedback" class="invalid-feedback">
            <span id="ds_generoFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-md-6">
        <label for="id_telegram" class="form-label">ID Telegram</label>
        <input type="number" class="form-control" id="id_telegram" name="id_telegram" value="{{ dados.user.id_telegram }}">
        <div id="id_telegramFeedback" class="invalid-feedback">
            <span id="id_telegramFeedbackDescricao"></span>
        </div>
    </div>
    <div class="col-12">
        <a href="#" class="btn btn-outline-primary btn-sm" onclick="atualizarDados()" type="submit">Atualizar Dados</a>
    </div>
  </form>

{% endblock %}
